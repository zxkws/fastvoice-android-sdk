name: Android SDK

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag matches SDK version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew -q :fastvoice-sdk:properties | sed -n 's/^version: //p' | head -n 1)"
          test "$GITHUB_REF_NAME" = "$version"

      - name: Build, test, and publish locally
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :fastvoice-sdk:testDebugUnitTest \
            :fastvoice-sdk:lint \
            :fastvoice-sdk:assembleRelease \
            :fastvoice-sdk:publishToMavenLocal \
            :sample:assembleDebug \
            --stacktrace

      - name: Compile sample against published Maven coordinate
        run: ./gradlew :sample:clean :sample:assembleDebug -PusePublishedSdk --stacktrace

      - name: Verify distributable Maven publication
        shell: bash
        run: |
          set -euo pipefail
          aar="fastvoice-sdk/build/outputs/aar/fastvoice-sdk-release.aar"
          test -f "$aar"
          listing="$RUNNER_TEMP/fastvoice-aar-listing.txt"
          unzip -Z1 "$aar" > "$listing"
          grep -Fxq "libs/sherpa-onnx-1.13.2-classes.jar" "$listing"
          for abi in arm64-v8a armeabi-v7a; do
            grep -Fxq "jni/$abi/libonnxruntime.so" "$listing"
            grep -Fxq "jni/$abi/libsherpa-onnx-jni.so" "$listing"
            grep -Fxq "jni/$abi/libwebrtc-audio-processing-2.so" "$listing"
            grep -Fxq "jni/$abi/libfastvoice_webrtc_aec3.so" "$listing"
            grep -Fxq "jni/$abi/libc++_shared.so" "$listing"
          done
          grep -Fxq "assets/fastvoice/licenses/Apache-2.0.txt" "$listing"
          grep -Fxq "assets/fastvoice/licenses/NOTICE.txt" "$listing"
          grep -Fxq "assets/fastvoice/licenses/ONNX-Runtime-MIT.txt" "$listing"
          grep -Fxq "assets/fastvoice/licenses/WebRTC-BSD-3-Clause.txt" "$listing"
          if grep -Eqi "silero|jni/armeabi/" "$listing"; then
            exit 1
          fi

          version="$(./gradlew -q :fastvoice-sdk:properties | sed -n 's/^version: //p' | head -n 1)"
          published="$HOME/.m2/repository/io/github/zxkws/fastvoice-android-sdk/$version"
          test -f "$published/fastvoice-android-sdk-$version.aar"
          test -f "$published/fastvoice-android-sdk-$version-sources.jar"
          test -f "$published/fastvoice-android-sdk-$version-javadoc.jar"
          pom="$published/fastvoice-android-sdk-$version.pom"
          test -f "$pom"
          grep -q "<groupId>io.github.zxkws</groupId>" "$pom"
          grep -q "<artifactId>fastvoice-android-sdk</artifactId>" "$pom"
          grep -q "com.squareup.okhttp3" "$pom"
          grep -q "concentus" "$pom"
          grep -q "<licenses>" "$pom"
          grep -q "<developers>" "$pom"
          grep -q "<scm>" "$pom"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastvoice-android-sdk
          if-no-files-found: error
          path: |
            fastvoice-sdk/build/outputs/aar/fastvoice-sdk-release.aar
            sample/build/outputs/apk/debug/sample-debug.apk

  publish-central:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Maven Central secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
          test -n "$SIGNING_IN_MEMORY_KEY"
          test -n "$SIGNING_IN_MEMORY_KEY_PASSWORD"

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :fastvoice-sdk:publishToMavenCentral --no-daemon --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, publish-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: fastvoice-android-sdk
          path: verified

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp verified/fastvoice-sdk/build/outputs/aar/fastvoice-sdk-release.aar \
            release/fastvoice-android-sdk-${GITHUB_REF_NAME}.aar
          cp verified/sample/build/outputs/apk/debug/sample-debug.apk \
            release/fastvoice-sample-${GITHUB_REF_NAME}.apk
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "FastVoice Android SDK ${GITHUB_REF_NAME}"
          --generate-notes
